server {
  listen 80;
  root /usr/share/nginx/html;

  # La API se sirve desde el mismo origen que el frontend: /api/* → contenedor api.
  # Funciona igual se entre por localhost, 127.0.0.1 o la IP de la máquina, sin CORS.
  location /api/ {
    proxy_pass http://api:3000/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Clinic-Id $http_x_clinic_id;
  }

  # SPA: cualquier ruta del frontend (/conversaciones/…, /simulador) sirve index.html.
  location / {
    try_files $uri /index.html;
  }

  # Los assets llevan hash en el nombre: se pueden cachear sin límite.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
}
