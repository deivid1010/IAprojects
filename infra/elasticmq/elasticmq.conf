# ElasticMQ: emula Amazon SQS en local. El backend usa el mismo SDK de AWS que
# en producción; solo cambia el endpoint (SQS_ENDPOINT).
include classpath("application.conf")

node-address {
  protocol = http
  host = "*"          # las URLs de cola usan el host de cada petición (localhost o elasticmq)
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

queues {
  # Mensajes que agotaron los reintentos o tumbaron al worker repetidamente.
  "incoming-messages-dlq.fifo" {
    fifo = true
  }

  # FIFO: orden por conversación (MessageGroupId) y deduplicación por
  # message_id (MessageDeduplicationId), igual que en AWS.
  "incoming-messages.fifo" {
    fifo = true
    contentBasedDeduplication = false
    # Mayor que el tiempo máximo de un turno (timeout del LLM + envío).
    defaultVisibilityTimeout = 60 seconds
    deadLettersQueue {
      name = "incoming-messages-dlq.fifo"
      # El worker maneja la falla en el intento 3 (respaldo + escalar).
      # La DLQ atrapa lo que ni siquiera llegó a manejarse (p. ej. el worker se cae).
      maxReceiveCount = 4
    }
  }
}
